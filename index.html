<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e5f74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Our Workouts</title>
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1f2a30; --muted:#66737a; --line:#e2ddd2;
  --acc:#1e5f74; --acc-d:#164a5b; --acc-l:#e1eef2; --hot:#d0602e; --hot-l:#fbe9df; --ok:#2f7a4f; --ok-l:#e2f1e7;
  --fig:#1f2a30; --fig-far:#a3adb2; --eq:#1e5f74; --dg-bg:#ebe6dc;
  --r:14px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;min-height:100%;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
header.top h1{margin:0 0 8px;font-size:22px;display:flex;align-items:center;gap:8px}
header.top h1 .sp{flex:1}
.sync{font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--acc-l);color:var(--acc-d)}
.sync.local{background:var(--hot-l);color:var(--hot)}
.who{font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;cursor:pointer;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:99px;background:#fff;outline:none}
.search:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:6px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.sm{padding:4px 10px;font-size:13px}
.pad{padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 16px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;border:0;padding:0;text-align:left}
.tile .ph{aspect-ratio:4/3;background:var(--dg-bg);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph svg{width:100%;height:100%}
.tile .tx{padding:9px 11px 11px}
.tile .tt{font-weight:600;font-size:15px;line-height:1.25}
.tile .mt{font-size:12px;color:var(--muted);margin-top:3px}
.tile .pb{font-size:12px;color:var(--hot);font-weight:600;margin-top:2px}
.tile.add{border:2px dashed var(--line);box-shadow:none;background:transparent;align-items:center;justify-content:center;min-height:150px;color:var(--muted);font-weight:600}
.tile.add .big{font-size:34px;line-height:1}
svg.dg .fig polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.dg .lm{stroke:var(--fig);stroke-width:5}
svg.dg .lf{stroke:var(--fig-far);stroke-width:5}
svg.dg .tr{stroke:var(--fig);stroke-width:7}
svg.dg .hd{fill:var(--fig)}
svg.dg .fl{stroke:#c9bfae;stroke-width:2}
svg.dg .eq,svg.dg .eqf{fill:var(--eq)}
svg.dg .eqd{fill:#fff}
svg.dg .wall{fill:#d3cabb}
svg.dg .eqs{stroke:#7d8a90;stroke-width:3;stroke-linecap:round}
svg.dg .cab{stroke:#7d8a90;stroke-width:1.5}
.empty{text-align:center;color:var(--muted);padding:40px 24px}
.empty .big{font-size:44px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 4px 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .ic{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--acc);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;height:56px;padding:0 20px 0 16px;border-radius:99px;border:0;background:var(--acc);color:#fff;font-size:17px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;gap:6px}
.fab b{font-size:28px;font-weight:400;line-height:1}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .in{max-width:720px;margin:0 auto;padding:0 0 60px}
.sbar{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line)}
.sbar .sp{flex:1;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dan{color:var(--hot);border-color:var(--hot-l);background:var(--hot-l)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.block{display:block;width:100%;padding:12px;font-size:17px}
.btn:disabled{opacity:.5}
.hero{background:var(--dg-bg);position:relative}
.hero svg{display:block;width:100%;max-height:46vh}
.hero img{display:block;width:100%;max-height:50vh;object-fit:cover}
.heroseg{position:absolute;right:10px;bottom:10px;font-size:13px}
.heroseg button{padding:5px 10px}
.credit{font-size:11px;color:var(--muted);padding:4px 16px 0}
.credit a{color:var(--muted)}
.plan{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:8px 16px 12px;overflow:hidden}
.plan .ph{background:var(--acc);color:#fff;padding:12px 14px}
.plan .ph .k{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.plan .ph .t{font-size:21px;font-weight:700;line-height:1.2}
.plan .ph .f{font-size:13px;opacity:.9}
.plan .bd{padding:10px 14px 14px}
.plan.cardio .ph{background:var(--hot)}
.slots{list-style:none;margin:0;padding:0;counter-reset:s}
.slots li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.slots li:last-child{border-bottom:0}
.slots li::before{counter-increment:s;content:counter(s);font-weight:700;color:var(--muted);width:16px;flex:none}
.slots .nm{flex:1;min-width:0}
.slots .sr{font-weight:600;white-space:nowrap;font-size:14px}
.slots .sub{font-size:12px;color:var(--muted)}
.rest{background:var(--ok-l);color:var(--ok);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}
.bar2{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}
.bar2 i{display:block;height:100%;background:var(--hot)}
.slot{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:0 16px 12px;padding:12px 13px}
.slot.done{box-shadow:none;border:2px solid var(--ok-l)}
.slot .top{display:flex;gap:10px;align-items:center}
.slot .top .th{width:60px;height:46px;border-radius:8px;overflow:hidden;background:var(--dg-bg);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.slot .top .th img,.slot .top .th svg{width:100%;height:100%;object-fit:cover}
.slot .nm{font-weight:700}
.slot .tg{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.slot .target{font-weight:700;color:var(--acc-d);white-space:nowrap}
.slot .last{font-size:13px;color:var(--muted);margin-top:6px}
.slot .ok{color:var(--ok);font-weight:600;font-size:14px;margin-top:6px}
.pl{background:var(--card);border:2px solid transparent;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;cursor:pointer}
.pl.on{border-color:var(--acc)}
.pl .t{font-weight:700;font-size:17px}
.pl .d{font-size:14px;color:var(--muted)}
.phase{position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.85);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;color:var(--acc-d)}
.det{padding:14px 16px}
.det h2{margin:0 0 6px;font-size:25px;line-height:1.2}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.tag{background:var(--acc-l);color:var(--acc-d);border-radius:99px;padding:2px 10px;font-size:13px}
.tag.ok{background:var(--ok-l);color:var(--ok)}
.tag.hot{background:var(--hot-l);color:var(--hot)}
.sec{margin-top:22px}
.sec h3{margin:0 0 8px;font-size:17px}
.steps{margin:0;padding-left:24px}
.steps li{margin-bottom:9px}
.bul{margin:0;padding:0;list-style:none}
.bul li{padding:6px 0 6px 28px;position:relative}
.bul li::before{position:absolute;left:2px;top:6px}
.bul.good li::before{content:"✓";color:var(--ok);font-weight:700}
.bul.bad li::before{content:"✗";color:var(--hot);font-weight:700}
.alt{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:11px 13px;margin-bottom:9px}
.alt.link{cursor:pointer}
.alt .an{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alt .ad{font-size:14px;color:var(--muted);margin-top:3px}
.alt .aa{margin-top:8px}
.vid{position:relative;padding-top:56.25%;border-radius:var(--r);overflow:hidden;background:#000;margin-bottom:10px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.myphoto{width:100%;border-radius:var(--r);display:block;margin-bottom:10px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:10px 11px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-weight:700;font-size:18px;line-height:1.2;margin-top:2px}
.stat .s{font-size:12px;color:var(--muted)}
form.ed,.ed{padding:14px 16px}
.f{margin-bottom:16px}
.f > label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--acc)}
.f textarea{min-height:90px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted);margin-top:4px}
.row2{display:flex;gap:10px}.row2 .f{flex:1;min-width:0}
.withmic{display:flex;gap:8px;align-items:flex-start}
.withmic > input,.withmic > textarea{flex:1}
.mic{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mic.live{background:var(--hot);border-color:var(--hot);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(208,96,46,.2)}}
.quick{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin:8px 16px}
.quick .q1{display:flex;gap:8px}
.quick input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;outline:none}
.quick .hint{font-size:12px;color:var(--muted);margin-top:6px}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:7px 8px}
.set.on{border-color:var(--acc)}
.set .no{width:22px;font-weight:700;color:var(--muted);text-align:center;flex:none}
.set input{width:64px;padding:8px;border:1px solid var(--line);border-radius:8px;text-align:center;font-weight:600;font-size:17px;outline:none;min-width:0}
.set input:focus{border-color:var(--acc)}
.set .u{font-size:13px;color:var(--muted)}
.set .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.chipblk{margin-top:8px}
.chipblk .lbl{margin:6px 0 0}
.lastt{background:var(--acc-l);color:var(--acc-d);border-radius:10px;padding:8px 12px;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lastt .sp{flex:1}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:11px 13px;margin:0 16px 9px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.card .bd{flex:1;min-width:0}
.card .tt{font-weight:600}
.card .sm{font-size:14px}
.card .mt{font-size:12px;color:var(--muted);margin-top:2px}
.card .nt{font-size:13px;color:var(--muted);font-style:italic;margin-top:3px;white-space:pre-wrap}
.card .del{border:0;background:none;font-size:18px;cursor:pointer;padding:2px 6px;color:var(--muted)}
.card .th{width:52px;height:40px;border-radius:8px;overflow:hidden;background:var(--dg-bg);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.card .th svg,.card .th img{width:100%;height:100%;object-fit:cover}
.dayh{font-size:14px;font-weight:700;color:var(--muted);padding:14px 16px 6px;text-transform:uppercase;letter-spacing:.03em}
.chartbox{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 8px 4px;margin:6px 16px 12px}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chartbox .ctitle{font-size:13px;font-weight:600;color:var(--muted);padding:0 6px 4px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:5px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}
.tip b{display:block}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.plist li.on{font-weight:700;color:var(--acc)}
.plist li .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 16px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.photo-prev{width:100%;max-height:260px;border-radius:12px;object-fit:cover;display:block;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;z-index:50;font-size:14px;max-width:90%;text-align:center}
.hide{display:none!important}
.small{font-size:13px;color:var(--muted)}
.note{background:#fff8e6;border-radius:10px;padding:10px 12px;font-size:14px}
a{color:var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="exercises.js"></script>
<script src="exercises-more.js"></script>
<script src="plans.js"></script>
<script src="photos.js"></script>
<script type="module">
/* ============================================================
   Data layer: Firebase (shared) or localStorage (this device only)
   Everything lives under /gyms/{householdId}/...
   ============================================================ */
const CFG = window.APP_CONFIG || {};
const HID = (CFG.householdId || "household").trim();
const ROOT = "gyms";
document.title = CFG.appName || "Our Workouts";
const { EX: BUILTIN, svg: drawSvg, animate } = window.WORKOUT_LIB;
const { PLANS, CARDIO, SPECIALS } = window.WORKOUT_PLANS;
const PHOTOS = window.WORKOUT_PHOTOS || {};

const store = { mode: "local" };
let fb = null;

async function initStore() {
  if (CFG.firebase && CFG.firebase.projectId) {
    try {
      const base = "https://www.gstatic.com/firebasejs/10.12.2/";
      const [{ initializeApp }, fs] = await Promise.all([
        import(base + "firebase-app.js"),
        import(base + "firebase-firestore.js"),
      ]);
      const app = initializeApp(CFG.firebase);
      const db = fs.initializeFirestore(app, {
        localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }),
      });
      fb = { db, fs };
      store.mode = "cloud";
    } catch (e) {
      console.warn("Firebase failed, using local mode", e);
      store.mode = "local";
    }
  }
}
const lsKey = (coll) => "wk:" + HID + ":" + coll;
function localLoad(coll) { try { return JSON.parse(localStorage.getItem(lsKey(coll)) || "[]"); } catch { return []; } }
function localSave(coll, arr) {
  try { localStorage.setItem(lsKey(coll), JSON.stringify(arr)); }
  catch { toast("This device is out of storage space."); }
}
function subscribe(coll, cb) {
  if (store.mode === "cloud") {
    const { db, fs } = fb;
    return fs.onSnapshot(fs.collection(db, ROOT, HID, coll),
      (snap) => cb(snap.docs.map((d) => ({ ...d.data(), id: d.id }))),
      (err) => { console.error(err); toast("Can't reach the shared database"); cb([]); });
  }
  const fire = () => cb(localLoad(coll));
  window.addEventListener("wk-local-" + coll, fire);
  fire();
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function saveDoc(coll, obj) {
  const id = obj.id || newId();
  const data = { ...obj, id, updatedAt: Date.now() };
  for (const k in data) if (data[k] === undefined) delete data[k];
  if (store.mode === "cloud") {
    const { db, fs } = fb;
    fs.setDoc(fs.doc(db, ROOT, HID, coll, id), data).catch((e) => { console.error(e); toast("Couldn't save. Check your connection."); });
  } else {
    const arr = localLoad(coll);
    const i = arr.findIndex((x) => x.id === id);
    if (i >= 0) arr[i] = data; else arr.push(data);
    localSave(coll, arr);
    window.dispatchEvent(new Event("wk-local-" + coll));
  }
  return id;
}
function deleteDoc(coll, id) {
  if (store.mode === "cloud") {
    const { db, fs } = fb;
    fs.deleteDoc(fs.doc(db, ROOT, HID, coll, id)).catch(console.error);
  } else {
    localSave(coll, localLoad(coll).filter((x) => x.id !== id));
    window.dispatchEvent(new Event("wk-local-" + coll));
  }
}

/* ============================================================
   Helpers
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg, ms = 2600) {
  document.querySelectorAll(".toast").forEach((x) => x.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
const pad2 = (n) => String(n).padStart(2, "0");
const isoDay = (d = new Date()) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
function dayLabel(iso) {
  const today = isoDay(), y = new Date(); y.setDate(y.getDate() - 1);
  if (iso === today) return "Today";
  if (iso === isoDay(y)) return "Yesterday";
  const d = new Date(iso + "T12:00:00");
  const opts = { weekday: "short", month: "short", day: "numeric" };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
}
const shortDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
const num = (n) => (n == null || n === "" || isNaN(n) ? "" : String(Math.round(Number(n) * 10) / 10));
function fmtTime(s) {
  s = Math.round(Number(s) || 0);
  if (s < 60) return s + " sec";
  if (s >= 600 && s % 60 === 0) return s / 60 + " min";
  return Math.floor(s / 60) + ":" + pad2(s % 60);
}
const fmtClock = (s) => { s = Math.round(Number(s) || 0); return Math.floor(s / 60) + ":" + pad2(s % 60); };
function parseTime(str) {
  str = String(str || "").trim().toLowerCase();
  if (!str) return null;
  let m = str.match(/^(\d+):(\d{1,2})$/);
  if (m) return +m[1] * 60 + +m[2];
  m = str.match(/^(\d+(?:\.\d+)?)\s*(m|min|mins|minutes?)$/);
  if (m) return Math.round(+m[1] * 60);

   Dictation: turn "bench press 3 sets of 8 at 135 pounds" into fields

const ONES = { zero: 0, oh: 0, one: 1, a: 1, an: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19 };

    else if (w in TENS) { if (cur != null && cur >= 100) cur += TENS[w]; else { flush(); cur = TENS[w]; } }

let chartPts = [];
function chartSvg(data) {
  const W = 340, H = 180, L = 40, R = 14, T = 16, B = 26;
  if (!data.length) return `<div class="small" style="padding:20px">No data for this view yet.</div>`;
  const vals = data.map((d) => d.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo = lo - Math.max(1, lo * 0.1); hi = hi + Math.max(1, hi * 0.1); }
  const span = hi - lo, stepRaw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(stepRaw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= stepRaw) || stepRaw;
  lo = Math.max(0, Math.floor(lo / step) * step); hi = Math.ceil(hi / step) * step;
  const t0 = new Date(data[0].date + "T12:00:00").getTime(), t1 = new Date(data[data.length - 1].date + "T12:00:00").getTime();
  const x = (d) => data.length === 1 ? (L + W - R) / 2 : L + ((new Date(d.date + "T12:00:00").getTime() - t0) / (t1 - t0)) * (W - L - R);

  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#ece7dd"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#66737a">${tickLbl(v)}</text>`;
  const xl = data.length === 1 ? [data[0]] : [data[0], data[data.length - 1]];
  g += xl.map((d, i) => `<text x="${x(d)}" y="${H - 7}" text-anchor="${data.length === 1 ? "middle" : i ? "end" : "start"}" font-size="11" fill="#66737a">${shortDate(d.date)}</text>`).join("");
  chartPts = data.map((d) => ({ x: x(d), y: y(d.v), d }));
  const path = chartPts.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
  const maxI = vals.indexOf(Math.max(...vals));
  const dots = chartPts.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${i === maxI ? "var(--hot)" : "var(--acc)"}" stroke="#fff" stroke-width="2"/>`).join("");
  const lastP = chartPts[chartPts.length - 1];
  const lbl = `<text id="lastlbl" x="${Math.min(lastP.x, W - R)}" y="${lastP.y - 9}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${esc(fmtMetric(lastP.d.v, S.progMetric))}</text>`;
  return `<svg id="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">${g}<path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/><line id="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#9aa5ab" stroke-dasharray="3 3" class="hide"/>${dots}${lbl}<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="tip hide" id="tip"></div>`;
}
function wireChart() {
  const svg = $("#chart"), tip = $("#tip"), xh = $("#xh"), lbl = $("#lastlbl");
  if (!svg) return;
  const show = (ev) => {
    const r = svg.getBoundingClientRect(), sx = 340 / r.width;
    const px = (ev.clientX - r.left) * sx;

    for (const p of chartPts) if (Math.abs(p.x - px) < Math.abs(best.x - px)) best = p;
    const d = best.d;
    let detail = "";

   ============================================================ */
const planById = (id) => PLANS.find((p) => p.id === id);
const myPlan = () => (me() ? planById(me().planId) : null);
const specialFor = (person) => SPECIALS.find((d) => d.key === (person && person.special)) || SPECIALS[0];
function planSeq(plan, person) {
  return plan.sequence.map((d) => (d === "SPECIAL" ? specialFor(person) : d));
}
const mySessions = () => S.sessions.filter((x) => x.personId === S.personId);
function activeSession() {
  return mySessions().filter((x) => !x.finishedAt).sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0))[0];
}
function lastFinished(planId) {
  return mySessions().filter((x) => x.finishedAt && x.planId === planId).sort((a, b) => b.finishedAt - a.finishedAt)[0];
}
function nextSeqIndex(plan) {
  const last = lastFinished(plan.id);
  const n = plan.sequence.length;
  return last ? (Number(last.seq) + 1) % n : 0;
}
function dayForSession(sess) {
  const plan = planById(sess.planId);
  if (!plan) return null;
  const owner = S.people.find((p) => p.id === sess.personId);
  if (sess.dayKey && sess.dayKey.startsWith("SP_")) return SPECIALS.find((d) => d.key === sess.dayKey);
  return planSeq(plan, owner)[sess.seq] || null;
}
function slotChoice(slot, sess, i) {
  if (sess && sess.choices && sess.choices[i]) return sess.choices[i];
  const ids = slot.options.map((o) => o.ex);
  const recent = myLogs().filter((l) => ids.includes(l.exId)).sort((a, b) => (b.ts || 0) - (a.ts || 0))[0];
  return recent ? recent.exId : ids[0];
}
const slotLabel = (slot, exId) => (slot.options.find((o) => o.ex === exId) || {}).label || (exById(exId) || {}).name || "";
function restNote(plan) {
  const last = lastFinished(plan.id);
  if (!last) return "";
  const y = new Date(); y.setDate(y.getDate() - 1);
  const lastDay = dayForSession(last);
  const name = lastDay ? lastDay.name : "";
  if (last.date === isoDay()) return `✅ You did ${esc(name)} today. Nice work! Next one is below.`;
  if (last.date === isoDay(y) && (plan.restAfterEvery || (plan.restAfter || []).includes(last.dayKey)))
    return `😴 Rest day suggested today (you did ${esc(name)} yesterday). Cardio is fine today.`;
  return "";
}
function weekRange() {
  const d = new Date(), dow = (d.getDay() + 6) % 7; // Monday = 0
  const mon = new Date(d); mon.setDate(d.getDate() - dow);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return [isoDay(mon), isoDay(sun)];
}
function cardioWeek() {
  const [a, b] = weekRange();
  const logs = myLogs().filter((l) => l.date >= a && l.date <= b && (exById(l.exId) || {}).group === "Cardio");
  const secs = logs.reduce((t, l) => t + (l.sets || []).reduce((u, st) => u + (Number(st.s) || 0), 0), 0);
  return { min: Math.round(secs / 60), sessions: logs.length };
}
function slotList(day, sess) {

    const exId = slotChoice(sl, sess, i);
    return `<li><div class="nm">${esc(slotLabel(sl, exId))}<div class="sub">${esc(sl.body)} · ${esc(sl.name)}</div></div><div class="sr">${sl.sets} × ${esc(sl.reps)}</div></li>`;
  }).join("")}</ol>`;
}

async function shrinkImage(file, max = 900) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.72);
  } finally { URL.revokeObjectURL(url); }
}
function saveMedia(ex, patch) {
  if (ex.custom) {
    const c = S.custom.find((x) => x.id === ex.id);
    saveDoc("exercises", { ...c, ...patch });
  } else {
    saveDoc("media", { ...(S.media[ex.id] || {}), ...patch, id: ex.id });
  }
}

document.addEventListener("click", (e) => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { S.tab = tabBtn.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-act]");
  if (!a || a.tagName === "INPUT") return;
  const act = a.dataset.act, id = a.dataset.id;
  switch (act) {
    case "close": closeSheet(); break;
    case "filter": S.filter = a.dataset.v; render(); break;
    case "ex": e.preventDefault(); openExercise(id); break;
    case "ex-new": openExEditor(null); break;
    case "ex-edit": openExEditor(id); break;
    case "ex-save": saveExercise(); break;
    case "ex-del":
      if (confirm("Delete this exercise? Logged workouts for it stay in your history.")) { deleteDoc("exercises", id); closeSheet(); closeSheet(); }
      break;
    case "xk": topSheet().el._ex.kind = a.dataset.v; a.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === a)); break;
    case "alt-add": {
      const ex = exById(a.dataset.ex), alt = ex.alts[+a.dataset.i];
      const dup = S.custom.find((c) => c.name.toLowerCase() === alt.name.toLowerCase());
      if (dup) { openExercise(dup.id); break; }
      const kind = /plank|hold|hang|isometric|wall sit|jump rope/i.test(alt.name + " " + alt.note) ? "time" : isNoEquip(alt) ? "reps" : ex.kind;
      openExEditor(null, {
        name: alt.name, group: ex.group, equip: EQUIP.includes(alt.equip) ? alt.equip : isNoEquip(alt) ? "None" : "Other", kind,
        steps: alt.note ? [alt.note] : [], tips: [], mistakes: [],
        alts: [{ id: ex.id, name: ex.name, equip: ex.equip, note: "The original exercise." }],
      });
      break;
    }
    case "media-video": {
      const ex = exById(id), cur = media(ex).video || "";
      const v = prompt("Paste a video link (YouTube works best):", cur);
      if (v != null) { saveMedia(ex, { video: v.trim() }); setTimeout(() => { closeSheet(); openExercise(id); }, 100); }
      break;
    }
    case "media-clear": {
      const ex = exById(id);
      if (confirm("Remove the saved photo and video for this exercise?")) { saveMedia(ex, { photo: "", video: "" }); setTimeout(() => { closeSheet(); openExercise(id); }, 100); }
      break;
    }
    case "log-new": openLog({}); break;
    case "log-ex": openLog({ exId: id }); break;
    case "log-edit": if (!e.target.closest(".del")) openLog({ logId: id }); break;
    case "log-del":
      e.stopPropagation();
      if (confirm("Delete this workout entry?")) { deleteDoc("logs", id); if (topSheet() && LG && LG.id === id) closeSheet(); toast("Deleted"); }
      break;
    case "log-save": saveLog(); break;
    case "lg-active": if (e.target.tagName !== "BUTTON") setActive(+a.dataset.i); break;
    case "lg-add": {
      const lastS = LG.sets[LG.sets.length - 1];
      LG.sets.push(lastS ? { ...lastS } : blankSet(lgEx().kind));
      LG.active = LG.sets.length - 1; renderSets(); break;
    }
    case "lg-rm": LG.sets.splice(+a.dataset.i, 1); LG.active = Math.min(LG.active, LG.sets.length - 1); renderSets(); break;
    case "lg-chip": {
      const st = LG.sets[LG.active] || LG.sets[0];
      st[a.dataset.f] = Number(a.dataset.v); renderSets(); break;
    }
    case "lg-bump": {
      const st = LG.sets[LG.active] || LG.sets[0];
      const stepV = LG.unit === "kg" ? Math.sign(+a.dataset.v) * 2.5 : +a.dataset.v;
      st.w = Math.max(0, (Number(st.w) || 0) + stepV); renderSets(); break;
    }
    case "lg-unit": {
      const to = a.dataset.v;
      if (to !== LG.unit) { LG.sets.forEach((s) => { if (s.w) s.w = Math.round(conv(s.w, LG.unit, to) * 2) / 2; }); LG.unit = to; }
      renderSets(); break;
    }
    case "lg-repeat": {
      const last = lastLog(LG.exId);
      if (last) { LG.sets = JSON.parse(JSON.stringify(last.sets)); LG.unit = last.unit || LG.unit; LG.active = 0; renderSets(); }
      break;
    }
    case "lg-fill": applySpoken($("#lgquick").value); break;
    case "lg-mic": listen(a, (txt) => { $("#lgquick").value = txt; applySpoken(txt); }); break;
    case "notes-mic": listen(a, (txt) => { const t = $("#lgnotes"); t.value = (t.value ? t.value.trim() + " " : "") + txt; LG.notes = t.value; }); break;
    case "quick-mic": listen(a, (txt) => { $("#quick").value = txt; openLog({ spoken: txt }); }); break;
    case "quick-go": { const v = $("#quick").value.trim(); if (v) openLog({ spoken: v }); else openLog({}); break; }
    case "people": openPeople(); break;
    case "plans": e.preventDefault(); openPlans(); break;
    case "plan-set": updateMe({ planId: id }); reopenTop(openPlans); render(); break;
    case "plan-cardio": updateMe({ cardio: !me().cardio }); reopenTop(openPlans); render(); break;
    case "plan-special": e.stopPropagation(); updateMe({ special: a.dataset.v }); reopenTop(openPlans); render(); break;
    case "plan-days": openDayPicker(); break;
    case "sess-start": startSession(+a.dataset.seq); break;
    case "sess-open": openSession(id); break;
    case "sess-finish": finishSession(false); break;
    case "sess-discard": finishSession(true); break;
    case "slot-pick": {
      const sess = S.sessions.find((x) => x.id === SESS.id);
      saveDoc("sessions", { ...sess, choices: { ...(sess.choices || {}), [a.dataset.i]: a.dataset.v } });
      break;
    }
    case "slot-log": logSlot(+a.dataset.i); break;
    case "hero": {
      const ph = $("#hphoto", topSheet().el), dg = $("#hdiag", topSheet().el);
      ph.classList.toggle("hide", a.dataset.v !== "photo"); dg.classList.toggle("hide", a.dataset.v === "photo");
      a.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === a));
      break;
    }
    case "person": choosePerson(id); break;
    case "person-add": addPerson(); break;
    case "unit":
      S.unit = a.dataset.v; localStorage.setItem("wk:unit", S.unit);
      a.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === a)); render(); break;
    case "hist": S.histAll = a.dataset.v === "all"; render(); break;
    case "metric": S.progMetric = a.dataset.v; render(); break;
  }
});
document.addEventListener("change", async (e) => {
  const a = e.target.closest("input[data-act='media-photo']");
  if (!a || !a.files[0]) return;
  const ex = exById(a.dataset.id);
  try {
    const url = await shrinkImage(a.files[0]);
    saveMedia(ex, { photo: url });
    toast("Photo saved");
    setTimeout(() => { closeSheet(); openExercise(ex.id); }, 100);
  } catch { toast("Couldn't read that photo."); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "quick") { e.preventDefault(); $("[data-act='quick-go']").click(); }
});

/* ============================================================
   Start
   ============================================================ */
let renderQueued = false;
function rerender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    const q = document.activeElement && document.activeElement.id === "q";
    render();
    refreshSessionSheet();
    if (q) { const el = $("#q"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
}
(async function start() {
  await initStore();
  subscribe("logs", (arr) => { S.logs = arr; rerender(); });
  subscribe("exercises", (arr) => { S.custom = arr.sort((a, b) => a.name.localeCompare(b.name)); rerender(); });
  subscribe("people", (arr) => { S.people = arr.sort((a, b) => a.name.localeCompare(b.name)); S.loaded.people = true; rerender(); });
  subscribe("media", (arr) => { S.media = Object.fromEntries(arr.map((m) => [m.id, m])); rerender(); });
  subscribe("sessions", (arr) => { S.sessions = arr; rerender(); });
  render();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
